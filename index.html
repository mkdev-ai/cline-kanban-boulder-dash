<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boulder Dash</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #game-canvas {
        display: block;
        /* Actual pixel dimensions are set by CanvasManager via JS.
           CSS size always fills the viewport so the canvas scales correctly. */
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated; /* keep pixel art crisp on HiDPI */
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
